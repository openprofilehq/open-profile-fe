name: DEPLOY FRONTEND Pipeline
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

          
  push:
    branches:
      - feat/ci-cd-pipeline
      - staging
      - production
jobs:
  ci:
    name: CI — Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint
        continue-on-error: true

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_URL: https://openprofile.bio
          NEXT_PUBLIC_API_URL: https://api.openprofile.bio
          API_BASE_URL: https://api.openprofile.bio

  deploy-staging:
    name: Deploy — Staging
    needs: ci
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging') || (github.event_name == 'push' && github.ref == 'refs/heads/staging')
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean stale source files on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          password: ${{ secrets.EC2_PASSWORD }}
          script: |
            rm -rf /var/www/openprofile-fe/staging/src

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          password: ${{ secrets.EC2_PASSWORD }}
          source: "./"
          target: /var/www/openprofile-fe/staging

      - name: Copy env file
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          password: ${{ secrets.EC2_PASSWORD }}
          script: |
            cp /var/www/openprofile-fe/envfile/.env.staging /var/www/openprofile-fe/staging/.env
      - name: Install dependencies and build
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          password: ${{ secrets.EC2_PASSWORD }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -e
            cd /var/www/openprofile-fe/staging
            pnpm install --config.ignore-scripts=true
            pnpm add react-icons --no-save || true
            rm -rf .next.new .next.old
            SKIP_TYPE_CHECK=1 NEXT_DIST_DIR=.next.new pnpm build
            if [ -d .next ]; then mv .next .next.old; fi
            mv .next.new .next
            rm -rf .next.old
      - name: Start app with PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          password: ${{ secrets.EC2_PASSWORD }}
          script: |
            cd /var/www/openprofile-fe/staging
            pm2 restart openprofile-staging-fe || PORT=3001 pm2 start "pnpm start" --name openprofile-staging-fe
            pm2 save
  deploy-production:
    name: Deploy — production
    needs: ci
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production') || (github.event_name == 'push' && github.ref == 'refs/heads/production')
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean stale source files on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          password: ${{ secrets.EC2_PASSWORD }}
          script: |
            rm -rf /var/www/openprofile-fe/production/src

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          password: ${{ secrets.EC2_PASSWORD }}
          source: "./"
          target: /var/www/openprofile-fe/production

      - name: Copy env file
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          password: ${{ secrets.EC2_PASSWORD }}
          script: |
            cp /var/www/openprofile-fe/envfile/.env.prod /var/www/openprofile-fe/production/.env
      - name: Install dependencies and build
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          password: ${{ secrets.EC2_PASSWORD }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -e
            cd /var/www/openprofile-fe/production
            pnpm install --config.ignore-scripts=true
            rm -rf .next.new .next.old
            SKIP_TYPE_CHECK=1 NEXT_DIST_DIR=.next.new pnpm build
            if [ -d .next ]; then mv .next .next.old; fi
            mv .next.new .next
            rm -rf .next.old
      - name: Start app with PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          password: ${{ secrets.EC2_PASSWORD }}
          script: |
            cd /var/www/openprofile-fe/production
            pm2 restart openprofile-production-fe || PORT=3002 pm2 start "pnpm start" --name openprofile-production-fe
            pm2 save
